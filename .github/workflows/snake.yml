name: Generate Monochrome Snake Animation

on:
  schedule:
    # 每 1 小时自动更新一次
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Monochrome Silver Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#18181b&color_dots=#f4f4f5,#d4d4d8,#a1a1aa,#52525b,#18181b
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ffffff&color_dots=#17171a,#2e2e33,#52525b,#a1a1aa,#fafafa

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
