<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="subCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17171a"/>
      <stop offset="100%" stop-color="#111113"/>
    </linearGradient>
    <linearGradient id="silverEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
  </style>

  <!-- Outer Bento Container -->
  <rect width="1200" height="420" rx="16" fill="url(#cardSurface)" stroke="#262626" stroke-width="1"/>
  <line x1="100" y1="1" x2="1100" y2="1" stroke="url(#silverEdge)" stroke-width="1.2"/>

  <!-- Section Header -->
  <text x="36" y="40" fill="#a3a3a3" font-size="11" class="mono" letter-spacing="1.4">02 // SELECTED REPOSITORIES &amp; TECHNICAL INDEX</text>
  <text x="1164" y="40" text-anchor="end" fill="#525252" font-size="11" class="mono">GITHUB.COM/HENRYKEEP</text>

  <!-- ==================== 2x2 ARCHITECTURAL PROJECT CARDS ==================== -->
  <!-- Card 01: SS2A-Monitor -->
  <g transform="translate(36, 60)">
    <rect width="552" height="108" rx="10" fill="url(#subCard)" stroke="#262626" stroke-width="0.9"/>
    <text x="22" y="28" fill="#a3a3a3" font-size="10.5" class="mono">NO. 01 // NATIVE ANDROID TELEMETRY</text>
    <text x="530" y="28" text-anchor="end" fill="#e4e4e7" font-size="11" class="mono">JAVA · WIDGET</text>
    <text x="22" y="52" fill="#ffffff" font-size="16" font-weight="600" class="sans">SS2A-Monitor ↗</text>
    <text x="22" y="74" fill="#8a8a8e" font-size="12.5" class="sans">Sub2API Android HomeScreen Widget with adaptive dual-mode &amp; real-time telemetry.</text>
    <text x="22" y="95" fill="#525252" font-size="10.5" class="mono">ANDROID · JAVA · REALTIME DASHBOARD · API MONITOR</text>
  </g>

  <!-- Card 02: qunbao -->
  <g transform="translate(612, 60)">
    <rect width="552" height="108" rx="10" fill="url(#subCard)" stroke="#262626" stroke-width="0.9"/>
    <text x="22" y="28" fill="#a3a3a3" font-size="10.5" class="mono">NO. 02 // INTELLIGENT AUTOMATION</text>
    <text x="530" y="28" text-anchor="end" fill="#e4e4e7" font-size="11" class="mono">PYTHON · CORE</text>
    <text x="22" y="52" fill="#ffffff" font-size="16" font-weight="600" class="sans">qunbao ↗</text>
    <text x="22" y="74" fill="#8a8a8e" font-size="12.5" class="sans">Python-driven automation runtime and intelligent backend service workflow.</text>
    <text x="22" y="95" fill="#525252" font-size="10.5" class="mono">PYTHON · AUTOMATION · ASYNC RUNTIME · BOT</text>
  </g>

  <!-- Card 03: xinliu-notes -->
  <g transform="translate(36, 182)">
    <rect width="552" height="108" rx="10" fill="url(#subCard)" stroke="#262626" stroke-width="0.9"/>
    <text x="22" y="28" fill="#a3a3a3" font-size="10.5" class="mono">NO. 03 // KNOWLEDGE ARCHITECTURE</text>
    <text x="530" y="28" text-anchor="end" fill="#e4e4e7" font-size="11" class="mono">TYPESCRIPT</text>
    <text x="22" y="52" fill="#ffffff" font-size="16" font-weight="600" class="sans">xinliu-notes ↗</text>
    <text x="22" y="74" fill="#8a8a8e" font-size="12.5" class="sans">Structured digital garden and minimalist knowledge workspace built with TypeScript.</text>
    <text x="22" y="95" fill="#525252" font-size="10.5" class="mono">TYPESCRIPT · MODERN WEB · DIGITAL GARDEN</text>
  </g>

  <!-- Card 04: claude-chat & AI Ecosystem -->
  <g transform="translate(612, 182)">
    <rect width="552" height="108" rx="10" fill="url(#subCard)" stroke="#262626" stroke-width="0.9"/>
    <text x="22" y="28" fill="#a3a3a3" font-size="10.5" class="mono">NO. 04 // AI AGENT WORKSPACE</text>
    <text x="530" y="28" text-anchor="end" fill="#e4e4e7" font-size="11" class="mono">LLM · AGENT</text>
    <text x="22" y="52" fill="#ffffff" font-size="16" font-weight="600" class="sans">claude-chat &amp; AI Tooling ↗</text>
    <text x="22" y="74" fill="#8a8a8e" font-size="12.5" class="sans">Conversational LLM interfaces, local API gateways, and mobile GUI agent workflows.</text>
    <text x="22" y="95" fill="#525252" font-size="10.5" class="mono">CLAUDE CODE · OPENAI API · FASTAPI · CLI</text>
  </g>

  <!-- Divider -->
  <line x1="36" y1="314" x2="1164" y2="314" stroke="#262626" stroke-width="0.8"/>

  <!-- ==================== 4-COLUMN ARCHITECTURAL TECH INDEX ==================== -->
  <g transform="translate(36, 342)">
    <!-- Col 1 -->
    <text x="0" y="0" fill="#a3a3a3" font-size="10.5" class="mono" letter-spacing="1">01 / LANGUAGES</text>
    <text x="0" y="24" fill="#ffffff" font-size="13" font-weight="500" class="sans">Python · Java · TypeScript</text>
    <text x="0" y="44" fill="#737373" font-size="12.5" class="sans">Kotlin · C / C++ · Shell</text>

    <!-- Col 2 -->
    <text x="290" y="0" fill="#a3a3a3" font-size="10.5" class="mono" letter-spacing="1">02 / AI &amp; AGENTS</text>
    <text x="290" y="24" fill="#ffffff" font-size="13" font-weight="500" class="sans">Claude Code · LLM Gateways</text>
    <text x="290" y="44" fill="#737373" font-size="12.5" class="sans">GUI Agents · FastAPI · MCP</text>

    <!-- Col 3 -->
    <text x="580" y="0" fill="#a3a3a3" font-size="10.5" class="mono" letter-spacing="1">03 / MOBILE &amp; WEB</text>
    <text x="580" y="24" fill="#ffffff" font-size="13" font-weight="500" class="sans">Android SDK · Node.js</text>
    <text x="580" y="44" fill="#737373" font-size="12.5" class="sans">React · Next.js · Tailwind</text>

    <!-- Col 4 -->
    <text x="870" y="0" fill="#a3a3a3" font-size="10.5" class="mono" letter-spacing="1">04 / EMBEDDED &amp; TOOLS</text>
    <text x="870" y="24" fill="#ffffff" font-size="13" font-weight="500" class="sans">STM32 / MSPM0 · Linux</text>
    <text x="870" y="44" fill="#737373" font-size="12.5" class="sans">Git · Docker · SSH · CLI</text>
  </g>
</svg>
