<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="100%" height="100%">
  <defs>
    <!-- Pure Monochrome Obsidian Surface -->
    <linearGradient id="surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121214"/>
      <stop offset="50%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <!-- Pure Silver Ambient Top Spotlight -->
    <radialGradient id="silverGlow" cx="50%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#e4e4e7" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Brushed Platinum & Pure Silver Text Gradient -->
    <linearGradient id="silverText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>

    <!-- Top Specular Hairline Highlight (Pure White/Silver) -->
    <linearGradient id="specularEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Vercel Geist Architectural Grid -->
    <pattern id="archGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <style>
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
    .serif { font-family: 'Instrument Serif', 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 400; }
    @keyframes breathe {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .pulse { animation: breathe 3s ease-in-out infinite; }
  </style>

  <!-- Main Card Frame -->
  <rect width="1200" height="290" rx="18" fill="url(#surface)" stroke="#262626" stroke-width="1"/>
  <rect width="1200" height="290" rx="18" fill="url(#archGrid)"/>
  <rect width="1200" height="290" rx="18" fill="url(#silverGlow)"/>

  <!-- Top Specular Light Refraction -->
  <line x1="100" y1="1" x2="1100" y2="1" stroke="url(#specularEdge)" stroke-width="1.2"/>

  <!-- Architectural Crosshairs (+) -->
  <g stroke="#525252" stroke-width="1" opacity="0.55">
    <path d="M 56 60 L 64 60 M 60 56 L 60 64"/>
    <path d="M 1136 60 L 1144 60 M 1140 56 L 1140 64"/>
    <path d="M 56 230 L 64 230 M 60 226 L 60 234"/>
    <path d="M 1136 230 L 1144 230 M 1140 226 L 1140 234"/>
  </g>

  <!-- Top Editorial Metadata Row -->
  <g transform="translate(80, 56)" class="mono" font-size="11" fill="#737373" letter-spacing="1.5">
    <text x="0" y="0">MONOGRAPH // HENRYKEEP · LANMIN LI</text>
    
    <!-- Right-aligned status badge -->
    <g transform="translate(825, -15)">
      <rect width="215" height="26" rx="13" fill="#17171a" stroke="#262626" stroke-width="1"/>
      <circle class="pulse" cx="15" cy="13" r="3.5" fill="#ffffff"/>
      <text x="28" y="16.5" fill="#d4d4d8" font-size="10.5" letter-spacing="0.6">BUILDING &amp; EXPLORING</text>
    </g>
  </g>

  <!-- Main Editorial Heading -->
  <g transform="translate(80, 130)">
    <text x="0" y="0" fill="url(#silverText)" font-size="45" font-weight="600" class="sans" letter-spacing="-1.4">
      Henrykeep <tspan fill="#404040" font-weight="300">/</tspan> <tspan class="serif" fill="#e4e4e7" font-size="48">Lanmin Li</tspan>
    </text>
    <text x="2" y="42" fill="#a3a3a3" font-size="16.5" font-weight="400" class="sans" letter-spacing="-0.1">
      Engineering <tspan fill="#ffffff" font-weight="500">AI Agents &amp; LLM Gateways</tspan>, <tspan fill="#ffffff" font-weight="500">Native Android Systems</tspan>, and <tspan class="serif" fill="#ffffff" font-size="19">Embedded Intelligence</tspan>.
    </text>
  </g>

  <!-- Subtle Horizontal Hairline Divider -->
  <line x1="80" y1="212" x2="1120" y2="212" stroke="#262626" stroke-width="0.8"/>

  <!-- Bottom Swiss Grid Footer Spec Bar -->
  <g transform="translate(80, 246)" class="mono" font-size="11">
    <text x="0" y="0" fill="#525252">DISCIPLINE</text>
    <text x="92" y="0" fill="#e4e4e7">AI Systems · Mobile · Embedded</text>

    <text x="370" y="0" fill="#525252">CORE</text>
    <text x="418" y="0" fill="#ffffff">Python · TypeScript · Java · C/C++</text>

    <text x="720" y="0" fill="#525252">BASE</text>
    <text x="768" y="0" fill="#e4e4e7">China (UTC+8)</text>

    <text x="1040" y="0" text-anchor="end" fill="#525252">EDITION // 2026</text>
  </g>
</svg>
