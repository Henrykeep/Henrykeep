<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="topEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
    .serif { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .cursor { animation: blink 1.1s step-end infinite; }
  </style>

  <!-- ==================== LEFT BENTO CARD: ARCHITECTURAL PILLARS ==================== -->
  <g transform="translate(0, 0)">
    <rect width="585" height="310" rx="16" fill="url(#cardGrad)" stroke="#262626" stroke-width="1"/>
    <line x1="60" y1="1" x2="525" y2="1" stroke="url(#topEdge)" stroke-width="1.2"/>

    <text x="34" y="40" fill="#a3a3a3" font-size="11" class="mono" letter-spacing="1.4">01 // ENGINEERING FOCUS</text>
    <text x="34" y="72" fill="#ffffff" font-size="21" font-weight="600" class="sans" letter-spacing="-0.4">
      Less noise. More <tspan class="serif" fill="#e4e4e7" font-size="24">structural elegance</tspan>.
    </text>
    <text x="34" y="98" fill="#8a8a8e" font-size="13" class="sans">
      Bridging frontier LLM workflows, native mobile telemetry, and low-level
    </text>
    <text x="34" y="117" fill="#8a8a8e" font-size="13" class="sans">
      hardware execution into cohesive, resilient tools.
    </text>

    <!-- 3 Minimalist Architecture Pillars -->
    <g transform="translate(34, 142)">
      <!-- Pillar 1 -->
      <rect x="0" y="0" width="517" height="42" rx="8" fill="#17171a" stroke="#262626" stroke-width="0.8"/>
      <text x="16" y="25" fill="#a3a3a3" font-size="11.5" class="mono">I.</text>
      <text x="44" y="25" fill="#ffffff" font-size="13" font-weight="500" class="sans">AI Agents, CLI Tooling &amp; API Gateways</text>
      <text x="500" y="25" text-anchor="end" fill="#525252" font-size="11" class="mono">Claude · OpenAI · Proxy</text>

      <!-- Pillar 2 -->
      <rect x="0" y="50" width="517" height="42" rx="8" fill="#17171a" stroke="#262626" stroke-width="0.8"/>
      <text x="16" y="75" fill="#a3a3a3" font-size="11.5" class="mono">II.</text>
      <text x="44" y="75" fill="#ffffff" font-size="13" font-weight="500" class="sans">Native Android &amp; Mobile GUI Agents</text>
      <text x="500" y="75" text-anchor="end" fill="#525252" font-size="11" class="mono">Java · Kotlin · Widgets</text>

      <!-- Pillar 3 -->
      <rect x="0" y="100" width="517" height="42" rx="8" fill="#17171a" stroke="#262626" stroke-width="0.8"/>
      <text x="16" y="125" fill="#a3a3a3" font-size="11.5" class="mono">III.</text>
      <text x="44" y="125" fill="#ffffff" font-size="13" font-weight="500" class="sans">Embedded Systems &amp; Full-Stack Web</text>
      <text x="500" y="125" text-anchor="end" fill="#525252" font-size="11" class="mono">C/C++ · TypeScript · MCU</text>
    </g>
  </g>

  <!-- ==================== RIGHT BENTO CARD: SPECIFICATION MANIFEST ==================== -->
  <g transform="translate(605, 0)">
    <rect width="595" height="310" rx="16" fill="url(#cardGrad)" stroke="#262626" stroke-width="1"/>
    <line x1="60" y1="1" x2="535" y2="1" stroke="url(#topEdge)" stroke-width="1.2"/>

    <!-- Minimalist Window Header -->
    <line x1="0" y1="42" x2="595" y2="42" stroke="#262626" stroke-width="0.8"/>
    <circle cx="24" cy="21" r="4.5" fill="#3f3f46"/>
    <circle cx="40" cy="21" r="4.5" fill="#3f3f46"/>
    <circle cx="56" cy="21" r="4.5" fill="#3f3f46"/>
    <text x="297" y="25" text-anchor="middle" fill="#737373" font-size="11.5" class="mono">~/henrykeep/manifest.ts</text>

    <!-- Code Content (Pure Monochrome Platinum & Zinc Palette) -->
    <g transform="translate(28, 72)" class="mono" font-size="12.5">
      <text x="0" y="0" fill="#404040">01</text>
      <text x="32" y="0" fill="#737373">export const <tspan fill="#ffffff" font-weight="600">developer</tspan> = Object.freeze({</text>

      <text x="0" y="24" fill="#404040">02</text>
      <text x="52" y="24" fill="#737373">handle: <tspan fill="#e4e4e7">"Henrykeep"</tspan>,</text>

      <text x="0" y="48" fill="#404040">03</text>
      <text x="52" y="48" fill="#737373">name: <tspan fill="#e4e4e7">"Lanmin Li"</tspan>,</text>

      <text x="0" y="72" fill="#404040">04</text>
      <text x="52" y="72" fill="#737373">languages: [<tspan fill="#ffffff">"Python"</tspan>, <tspan fill="#ffffff">"Java"</tspan>, <tspan fill="#ffffff">"TypeScript"</tspan>, <tspan fill="#ffffff">"C/C++"</tspan>],</text>

      <text x="0" y="96" fill="#404040">05</text>
      <text x="52" y="96" fill="#737373">focus: [<tspan fill="#ffffff">"AI Agents"</tspan>, <tspan fill="#ffffff">"Android"</tspan>, <tspan fill="#ffffff">"Embedded"</tspan>],</text>

      <text x="0" y="120" fill="#404040">06</text>
      <text x="52" y="120" fill="#737373">principles: {</text>

      <text x="0" y="144" fill="#404040">07</text>
      <text x="72" y="144" fill="#737373">aesthetic: <tspan fill="#e4e4e7">"Monochrome &amp; Precision"</tspan>,</text>

      <text x="0" y="168" fill="#404040">08</text>
      <text x="72" y="168" fill="#737373">alwaysShipping: <tspan fill="#ffffff" font-weight="600">true</tspan>,</text>

      <text x="0" y="192" fill="#404040">09</text>
      <text x="52" y="192" fill="#737373">}</text>

      <text x="0" y="216" fill="#404040">10</text>
      <text x="32" y="216" fill="#737373">});</text>
      <rect class="cursor" x="60" y="204" width="7" height="15" fill="#ffffff"/>
    </g>
  </g>
</svg>
